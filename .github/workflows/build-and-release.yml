name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: statpearls-mcp-linux-x64
          - os: windows-latest
            platform: windows
            artifact_name: statpearls-mcp-windows-x64.exe
          - os: macos-latest
            platform: darwin
            artifact_name: statpearls-mcp-darwin-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build JavaScript bundle
        run: bun run scripts/build.ts

      - name: Compile executable
        run: bun run scripts/compile.ts ${{ matrix.platform }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            artifacts/statpearls-mcp-darwin-x64
            artifacts/statpearls-mcp-linux-x64
            artifacts/statpearls-mcp-windows-x64.exe
            artifacts/index.js
            artifacts/index.js.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}